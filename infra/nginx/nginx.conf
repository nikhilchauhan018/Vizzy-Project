events {
    worker_connections 1024;
}

http {
    upstream vizzy_backend {
        least_conn;
        server app-a:8000 max_fails=3 fail_timeout=10s;
        server app-b:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Safe proxy retry behavior:
        # Intentionally omits non_idempotent so state-changing mutations (POST, PUT, DELETE)
        # are NEVER automatically retried if the request was sent to an upstream instance,
        # strictly preventing duplicate jobs, transactions, or state mutations.
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        # Dedicated health check routing for infrastructure and container orchestrators
        location /api/health/ {
            proxy_pass http://vizzy_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /healthz {
            proxy_pass http://vizzy_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location / {
            proxy_pass http://vizzy_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

